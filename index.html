<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計簿アプリ</title>

    <link rel="stylesheet" href="style.css">

   
</head>

<body>
    <h1>家計簿</h1>

    <h2>今月の収支</h2>

    <p>収入：<span id="income">0</span>円</p>
    <p>支出：<span id="expense">0</span>円</p>
    <p>残高：<span id="balance">0</span>円</p>

   <button id="addButton">＋ 収支を追加</button>
   <div id="inputForm" class="input-form">

    <h2>収支を登録</h2>
    <label for="date">日付</label>
    <input type="date" id="date">
    <label for="type">種類</label>
    <select id="type">
        <option value="expense">支出</option>
        <option value="income">収入</option>
    </select>

    <label for="amount">金額</label>
    <input type="number" id="amount" placeholder="例：1000">

    <label for="category">カテゴリ</label>
    <select id="category">
        <option value="食費">食費</option>
        <option value="日用品">日用品</option>
        <option value="交通費">交通費</option>
        <option value="娯楽">娯楽</option>
        <option value="光熱費">光熱費</option>
        <option value="給料">給料</option>
        <option value="その他">その他</option>
    </select>

    <label for="memo">メモ</label>
    <input type="text" id="memo" placeholder="例：スーパー">

    <button id="saveButton">登録する</button>

</div>

    <h2>最近の履歴</h2>

<div id="history">
    <p id="noHistory">まだ履歴はありません。</p>
</div>

    <script src="app.js"></script>
</body>
</html>
